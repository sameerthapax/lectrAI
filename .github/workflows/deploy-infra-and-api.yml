name: Deploy Infra and API

on:
  push:
    branches:
      - production

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '20'
  AR_REGION: us-central1
  AR_REPOSITORY: lectrai
  API_IMAGE_NAME: api
  TF_WORKING_DIR: infra/terraform/environments/dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔹 Node setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify Node runtime
        run: |
          node --version
          npm --version

      # 🔹 Install deps
      - name: Install dependencies
        run: npm ci

      # 🔥 Nx Cache (huge speed boost)
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
          key: nx-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nx-

      # 🔹 Resolve base/head for affected
      - name: Resolve Nx base/head
        run: |
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          echo "NX_BASE=$BASE_SHA" >> $GITHUB_ENV
          echo "NX_HEAD=$HEAD_SHA" >> $GITHUB_ENV

      # 🔥 Compute affected projects
      - name: Compute affected
        id: affected
        run: |
          AFFECTED=$(npx nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --json)
          echo "Affected: $AFFECTED"

          echo "api=$(node -e "const p=$AFFECTED; console.log(p.includes('api'))")" >> $GITHUB_OUTPUT
          echo "infra=$(node -e "const p=$AFFECTED; console.log(p.includes('infra'))")" >> $GITHUB_OUTPUT

      # 🔥 Build ONLY affected (FAST)
      - name: Build affected projects
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: |
          NX_DAEMON=false npx nx run api:build:production
          NX_DAEMON=false npx nx run api:prune

      - name: Recreate pruned lockfile
        if: ${{ steps.affected.outputs.api == 'true' }}
        working-directory: apps/api/dist
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      # 🔹 Skip message
      - name: Skip deploy
        if: ${{ steps.affected.outputs.api != 'true' && steps.affected.outputs.infra != 'true' }}
        run: echo "Nothing affected. Skipping deploy."

      # 🔹 GCP Auth
      - name: Authenticate to GCP
        if: ${{ steps.affected.outputs.api == 'true' || steps.affected.outputs.infra == 'true' }}
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Setup gcloud
        if: ${{ steps.affected.outputs.api == 'true' || steps.affected.outputs.infra == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      # 🔹 Docker login
      - name: Login to Artifact Registry
        if: ${{ steps.affected.outputs.api == 'true' }}
        run: |
          echo "${{ steps.gcp-auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin "https://${{ env.AR_REGION }}-docker.pkg.dev"

      # 🔹 Build + push image (FAST now)
      - name: Build and push API image
        if: ${{ steps.affected.outputs.api == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.API_IMAGE_NAME }}:production

      # 🔹 Terraform setup
      - name: Setup Terraform
        if: ${{ steps.affected.outputs.api == 'true' || steps.affected.outputs.infra == 'true' }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        if: ${{ steps.affected.outputs.api == 'true' || steps.affected.outputs.infra == 'true' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform plan
        id: tf_plan
        if: ${{ steps.affected.outputs.api == 'true' || steps.affected.outputs.infra == 'true' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_cloud_run_service_name: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_google_cloud_project: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: us-central1
          TF_VAR_environment: dev
          TF_VAR_cloud_run_image: ${{ env.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          TF_VAR_pubsub_topic_name: lectrai-events-dev
          TF_VAR_pubsub_subscription_name: lectrai-events-worker-dev
          TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
          TF_VAR_supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_database_url: ${{ secrets.SUPABASE_DB_URL }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_elevenlabs_api_key: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set +e
          terraform plan -lock-timeout=60s -input=false -detailed-exitcode -out=tfplan
          code=$?
          set -e

          if [ $code -eq 2 ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
          fi

      # 🔥 Apply only if needed
      - name: Terraform apply
        if: ${{ steps.tf_plan.outputs.has_diff == 'true' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
